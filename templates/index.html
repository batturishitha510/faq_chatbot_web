<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta charset="UTF-8">
  <title>FAQ Chatbot</title>
  <style>
    .fun-facts {
  color: #2c3e50; /* normal text color (light mode) */
}

body.dark .fun-facts {
  color: #f5f7fa; /* light text for dark mode */
}
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --accent: #4a90e2;
      --text: #2c3e50;
    }

    body.dark {
      --bg: #1e1e2f;
      --card: #2c2c3a;
      --accent: #6cb4ee;
      --text: #f0f0f0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      transition: 0.4s ease;
    }

    h1 {
      color: var(--accent);
      font-size: 36px;
      text-align: center;
    }

    form {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      padding: 12px 18px;
      width: 300px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: var(--card);
      color: var(--text);
    }

    input[type="submit"], button {
      padding: 10px 16px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    input[type="submit"]:hover, button:hover {
      background-color: #357ab8;
    }

    .chat-container {
      width: 600px;
      margin-top: 30px;
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      animation: fadeIn 0.6s ease;
    }

    .chat {
      margin-bottom: 15px;
    }

    .chat p { margin: 6px 0; }

    .typewriter {
      display: inline-block;
      overflow: hidden;
      border-right: .15em solid var(--accent);
      white-space: nowrap;
      animation: typing 2.5s steps(50, end), blink-caret 0.75s step-end infinite;
      max-width: 100%;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--accent); }
    }

    .facts-container, .related-container {
      margin-top: 20px;
      padding: 15px;
      background-color: #eaf3ff;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }
    
    /* 🎨 Fun Facts color fix */
.facts-container {
  color: #2c3e50; /* Normal mode text color */
}

body.dark .facts-container {
  color: #f5f7fa; /* Light text for dark mode */
  background-color: #2c2c3a; /* Match dark mode card background */
  border-left-color: #4a90e2; /* Accent border for dark mode */
}
    .related-container ul {
      list-style-type: "👉 ";
      padding-left: 20px;
    }

    #themeToggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    #typing {
      font-style: italic;
      color: #888;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <button id="themeToggle">🌙 Toggle Mode</button>
  <h1>FAQ Chatbot</h1>

  <form method="POST">
    <input type="text" name="question" placeholder="Ask about Python, HTML, CSS..." required>
    <input type="submit" value="Ask">
  </form>

  {% if chat_history %}
  <div class="chat-container">
    {% for chat in chat_history %}
    <div class="chat">
      <p><strong>You:</strong> {{ chat.question }}</p>
      <p>{{ chat.answer }}</p>
    </div>
    {% endfor %}

    {% if answer %}
    <p id="typing">Bot is typing...</p>
    {% endif %}
  </div>
  {% endif %}
<div class="chat-container">
  <div class="facts-container">
    <h3>💡 Fun Facts</h3>
    {% for fact in facts %}
      <p>{{ fact }}</p>
    {% endfor %}
  </div>
</div>

  <script>
    // 🌙 Theme toggle
    document.getElementById('themeToggle').onclick = () => {
      document.body.classList.toggle('dark');
    };
    // ⏳ Typing effect simulation
    const typing = document.getElementById('typing');
    if (typing) {
      setTimeout(() => typing.style.display = 'none', 1500);
    }
  </script>
</body>
</html>
